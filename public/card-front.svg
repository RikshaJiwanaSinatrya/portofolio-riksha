<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <clipPath id="avatarClip">
      <circle cx="300" cy="320" r="120"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="600" height="900" rx="40" fill="url(#bg)"/>

  <!-- Accent line -->
  <rect x="180" y="520" width="240" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Avatar placeholder -->
  <circle cx="300" cy="320" r="120" fill="#2a2a4a" stroke="url(#accent)" stroke-width="3"/>
  <circle cx="300" cy="290" r="40" fill="#4a4a6a"/>
  <ellipse cx="300" cy="400" rx="60" ry="50" fill="#4a4a6a"/>

  <!-- Name -->
  <text x="300" y="600" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" fill="white" letter-spacing="6">RIKSHA</text>

  <!-- Subtitle -->
  <text x="300" y="650" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#8888aa" letter-spacing="3">STUDENT DEVELOPER</text>

  <!-- Bottom accent dots -->
  <circle cx="270" cy="720" r="4" fill="#667eea" opacity="0.6"/>
  <circle cx="300" cy="720" r="4" fill="#764ba2" opacity="0.8"/>
  <circle cx="330" cy="720" r="4" fill="#667eea" opacity="0.6"/>
</svg>
