<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="900" rx="40" fill="url(#bg)"/>

  <!-- Large rectangular photo placeholder -->
  <rect x="80" y="100" width="440" height="520" rx="24" fill="#2a2a4a" stroke="url(#accent)" stroke-width="2"/>
  <!-- Person silhouette inside -->
  <circle cx="300" cy="310" r="60" fill="#4a4a6a"/>
  <ellipse cx="300" cy="460" rx="100" ry="80" fill="#4a4a6a"/>

  <!-- Accent line -->
  <rect x="200" y="660" width="200" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Name -->
  <text x="300" y="730" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="white" letter-spacing="6">RIKSHA</text>

  <!-- Subtitle -->
  <text x="300" y="775" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#8888aa" letter-spacing="3">STUDENT DEVELOPER</text>
</svg>
