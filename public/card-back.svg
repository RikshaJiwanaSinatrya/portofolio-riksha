<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>

  <rect width="600" height="900" rx="40" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="480" cy="150" r="200" fill="#667eea" opacity="0.05"/>
  <circle cx="120" cy="750" r="180" fill="#764ba2" opacity="0.05"/>

  <!-- Contact info -->
  <text x="300" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#667eea" letter-spacing="4">GET IN TOUCH</text>

  <rect x="180" y="410" width="240" height="2" rx="1" fill="url(#accent)" opacity="0.5"/>

  <text x="300" y="470" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#aaaacc">github.com/riksha</text>
  <text x="300" y="510" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#aaaacc">linkedin.com/in/riksha</text>

  <!-- Bottom accent -->
  <rect x="240" y="700" width="120" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="300" y="760" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#555577" letter-spacing="2">RIKSHA © 2026</text>
</svg>
