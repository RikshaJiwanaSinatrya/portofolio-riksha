<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d16"/>
      <stop offset="100%" style="stop-color:#141423"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="55%" style="stop-color:#764ba2"/>
      <stop offset="100%" style="stop-color:#f093fb"/>
    </linearGradient>
  </defs>

  <rect width="600" height="900" rx="40" fill="url(#bg)"/>

  <!-- Decorative accent shapes -->
  <circle cx="480" cy="150" r="200" fill="#667eea" opacity="0.05"/>
  <circle cx="120" cy="750" r="180" fill="#764ba2" opacity="0.06"/>

  <!-- Top monogram -->
  <text x="300" y="170" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="8" fill="#667eea">RIKSHA</text>

  <!-- Accent divider -->
  <rect x="265" y="200" width="70" height="4" rx="2" fill="url(#accent)"/>

  <!-- Section label -->
  <text x="300" y="320" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', monospace, monospace" font-size="13" font-weight="600" letter-spacing="6" fill="#8f9bff">GET IN TOUCH</text>

  <!-- Contact rows -->
  <g font-family="ui-monospace, 'JetBrains Mono', monospace, monospace">
    <!-- github -->
    <circle cx="200" cy="430" r="5" fill="url(#accent)"/>
    <text x="228" y="436" font-size="12" letter-spacing="3" fill="#6b6b80">GITHUB</text>
    <text x="200" y="486" font-size="22" letter-spacing="1" fill="#e6e6f0">github.com/riksha</text>

    <rect x="180" y="512" width="240" height="1" fill="rgba(255,255,255,0.07)"/>

    <!-- linkedin -->
    <circle cx="200" cy="572" r="5" fill="url(#accent)"/>
    <text x="228" y="578" font-size="12" letter-spacing="3" fill="#6b6b80">LINKEDIN</text>
    <text x="200" y="628" font-size="22" letter-spacing="1" fill="#e6e6f0">linkedin.com/in/riksha</text>

    <rect x="180" y="654" width="240" height="1" fill="rgba(255,255,255,0.07)"/>

    <!-- location -->
    <circle cx="200" cy="714" r="5" fill="url(#accent)"/>
    <text x="228" y="720" font-size="12" letter-spacing="3" fill="#6b6b80">BASED IN</text>
    <text x="200" y="770" font-size="22" letter-spacing="1" fill="#e6e6f0">Indonesia · UTC+7</text>
  </g>

  <!-- Bottom footer -->
  <rect x="220" y="818" width="160" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="300" y="856" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', monospace, monospace" font-size="13" letter-spacing="4" fill="#555577">RIKSHA © 2026</text>
</svg>
